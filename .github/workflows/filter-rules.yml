name: Publish filter rules

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

concurrency:
  group: filter-rules

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and upload
        working-directory: tools/filter-rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./publish.sh
