<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Bench page</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1c1c1a; --muted:#6b6b66; --accent:#2b62d9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#9d9c95; --accent:#7aa5ff; } }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; margin:0; padding:32px 16px; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 8px; }
  .muted { color:var(--muted); }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:0; background:var(--accent); color:white; cursor:pointer; }
  #status { font-variant-numeric:tabular-nums; margin-top:16px; }
</style>
</head>
<body>
<main>
<h1>Audio Bench</h1>
<p class="muted">This page plays the far end of a call through a loopback WebRTC connection (as call sites do), records what the
microphone track would send, and returns it to the bench. It runs by itself when the bench opens it; opened by hand
(Safari), press Start once.</p>
<button id="start" hidden>Start</button>
<div id="status">Waiting…</div>
</main>
<script>
const q = new URLSearchParams(location.search);
const subject = q.get("subject") || "manual";
const schedule = (q.get("schedule") || "4,20,15,20,3").split(",").map(Number);
const constraints = { echoCancellation: q.get("ec") !== "0", noiseSuppression: q.get("ns") !== "0", autoGainControl: q.get("agc") !== "0" };
const total = schedule.reduce((a, b) => a + b, 0);
const $ = (id) => document.getElementById(id);
let lastSent = "";
const status = (t) => {
  $("status").textContent = t;
  // The bench keeps these in page.log, for runs nobody watches.
  const head = t.replace(/\d+ s left/, "running");
  if (head !== lastSent) { lastSent = head; fetch(`/status?subject=${encodeURIComponent(subject)}`, { method: "POST", body: t }).catch(() => {}); }
};
const report = (path, body, type = "application/json") => fetch(`/${path}?subject=${encodeURIComponent(subject)}`, { method: "POST", headers: { "content-type": type }, body });

const WORKLET = `
class Tap extends AudioWorkletProcessor {
  constructor() { super(); this.buf = []; this.n = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) { this.buf.push(new Float32Array(ch)); this.n += ch.length; }
    if (this.n >= 4800) { this.port.postMessage(this.buf); this.buf = []; this.n = 0; }
    return true;
  }
}
registerProcessor("tap", Tap);`;

async function run() {
  $("start").hidden = true;
  try {
    status("Asking for the microphone…");
    const mic = await navigator.mediaDevices.getUserMedia({ audio: constraints, video: false });
    const track = mic.getAudioTracks()[0];
    const settings = track.getSettings();

    status(`Mic open: ${track.label}`);
    const ctx = new AudioContext({ sampleRate: 48000 });
    await ctx.resume();
    status(`Audio context ${ctx.state}`);
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));

    // Record the processed mic track: exactly what a call would send.
    const chunks = [];
    const tap = new AudioWorkletNode(ctx, "tap", { numberOfInputs: 1, numberOfOutputs: 0, channelCount: 1, channelCountMode: "explicit" });
    tap.port.onmessage = (e) => { for (const c of e.data) chunks.push(c); };
    ctx.createMediaStreamSource(mic).connect(tap);

    // The far end, into a loopback peer connection, out of an audio element: WebKit only hands MediaStream audio
    // to its echo canceller as the reference, and Chrome treats it like a call's remote voice.
    const far = await (await fetch("/stimuli/far.wav")).arrayBuffer().then((b) => ctx.decodeAudioData(b));
    const dest = ctx.createMediaStreamDestination();
    const pc1 = new RTCPeerConnection(), pc2 = new RTCPeerConnection();
    pc1.onicecandidate = (e) => e.candidate && pc2.addIceCandidate(e.candidate);
    pc2.onicecandidate = (e) => e.candidate && pc1.addIceCandidate(e.candidate);
    const remote = new Promise((r) => (pc2.ontrack = (e) => r(e.streams[0] || new MediaStream([e.track]))));
    pc1.addTrack(dest.stream.getAudioTracks()[0], dest.stream);
    await pc1.setLocalDescription(); await pc2.setRemoteDescription(pc1.localDescription);
    await pc2.setLocalDescription(); await pc1.setRemoteDescription(pc2.localDescription);
    const audio = new Audio();
    audio.srcObject = await remote;
    status("Remote track ready, playing");
    await audio.play();
    status("Playing far end");

    // Schedule: quiet, far only, near only (the bench's talker), both, quiet.
    const t0 = ctx.currentTime + 0.5;
    const at = (i) => t0 + schedule.slice(0, i).reduce((a, b) => a + b, 0);
    const playFar = (start, offset, dur) => {
      if (dur <= 0) return;
      const src = ctx.createBufferSource(), g = ctx.createGain();
      src.buffer = far; src.loop = true;
      g.gain.setValueAtTime(0, start); g.gain.linearRampToValueAtTime(1, start + 0.05);
      g.gain.setValueAtTime(1, start + dur - 0.05); g.gain.linearRampToValueAtTime(0, start + dur);
      src.connect(g).connect(dest);
      src.start(start, offset % far.duration); src.stop(start + dur);
    };
    playFar(at(1), 0, schedule[1]);
    playFar(at(3), schedule[1], schedule[3]);
    // The bench starts its talker on its own schedule; tell it when ours starts.
    setTimeout(() => report("talker", JSON.stringify({ at: Date.now() })), Math.max(0, (t0 - ctx.currentTime) * 1000));

    const recordedFrom = ctx.currentTime;
    const end = at(5) + 1;
    while (ctx.currentTime < end) {
      status(`Running: ${Math.max(0, end - ctx.currentTime).toFixed(0)} s left`);
      await new Promise((r) => setTimeout(r, 250));
    }
    mic.getTracks().forEach((t) => t.stop());
    pc1.close(); pc2.close(); audio.pause();

    const n = chunks.reduce((a, c) => a + c.length, 0), pcm = new Float32Array(n);
    let o = 0;
    for (const c of chunks) { pcm.set(c, o); o += c.length; }
    await report("meta", JSON.stringify({ userAgent: navigator.userAgent, settings, constraints, sampleRate: ctx.sampleRate,
      baseLatency: ctx.baseLatency, outputLatency: ctx.outputLatency, scheduleStartSec: t0 - recordedFrom, label: track.label }));
    await report("result", pcm.buffer, "application/octet-stream");
    await ctx.close();
    status("Done. You can close this tab.");
  } catch (e) {
    status(`Failed: ${e.name}: ${e.message}`);
    report("error", JSON.stringify({ name: e.name, message: e.message }));
  }
}

window.addEventListener("error", (e) => status(`Error: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => status(`Rejection: ${e.reason}`));
status("Page loaded");
if (q.get("manual") === "1" || subject === "manual") { $("start").hidden = false; $("start").onclick = run; status("Press Start, allow the microphone, then stay quiet until it says Done."); }
else run();
</script>
</body>
</html>
