<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supper · Plan a dinner</title>
<style>
/* Supper: Browsa's demo site. A dinner-party planner an agent (or you) can use end to end.
   Everything is local and nothing is ordered. Stable ids (#guests, #add-risotto, #slot-sat-evening…)
   make it easy to drive. */
:root {
  --paper: #f7f5ef; --card: #ffffff; --ink: #1f2a22; --muted: #66705f; --line: #e3e0d4;
  --green: #2f5d46; --green-soft: #e4ede6; --saffron: #e3a52f; --tomato: #d4553b;
  --serif: ui-serif, "New York", Georgia, serif; --sans: -apple-system, system-ui, "Helvetica Neue", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #151a16; --card: #1d241f; --ink: #edf0e8; --muted: #a2ab9c; --line: #2f382f; --green: #8cc4a3; --green-soft: #22332a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
header { display: flex; align-items: baseline; gap: 18px; padding: 22px 36px 8px; }
.logo { font: 600 30px/1 var(--serif); letter-spacing: -.01em; }
.logo span { color: var(--saffron); }
header p { margin: 0; color: var(--muted); }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; padding: 18px 32px 48px; align-items: start; }
@media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }

.planner { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 14px 18px; margin-bottom: 22px; }
.planner label { font-size: 13px; color: var(--muted); }
.planner input[type=number] { width: 64px; font: 600 16px var(--sans); padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--paper); color: var(--ink); }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 13px; font: 500 13px var(--sans); cursor: pointer; }
.chip[aria-pressed=true] { background: var(--green); color: #fff; border-color: var(--green); }
.budget { margin-left: auto; font-size: 13px; color: var(--muted); }
.budget b { color: var(--ink); font-size: 15px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
.recipe { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column;
  transition: transform .25s ease, box-shadow .25s ease, opacity .3s; }
.recipe:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,.08); }
.recipe.hidden { display: none; }
.recipe.chosen { outline: 2px solid var(--green); }
.plate { height: 150px; position: relative; display: grid; place-items: center; }
.plate .dish { width: 116px; height: 116px; border-radius: 50%; background: radial-gradient(circle, #fff 55%, #ece9df 56%, #fff 70%, #e5e1d4 71%);
  box-shadow: 0 8px 18px rgba(0,0,0,.12); position: relative; }
.plate .food { position: absolute; inset: 24px; border-radius: 50%; }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.body h3 { margin: 0; font: 600 19px/1.2 var(--serif); }
.body p { margin: 0; color: var(--muted); font-size: 13px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--green-soft); color: var(--green); }
.tag.time { background: transparent; color: var(--muted); padding-left: 0; }
.row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 8px; }
.price { font-weight: 600; }
.price small { color: var(--muted); font-weight: 400; }
.add { border: 0; border-radius: 10px; padding: 8px 12px; font: 600 13px var(--sans); background: var(--green); color: #fff; cursor: pointer; transition: background .2s; }
.recipe.chosen .add { background: var(--green-soft); color: var(--green); }

aside { position: sticky; top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
aside h2 { margin: 0; font: 600 22px var(--serif); }
.empty { color: var(--muted); font-size: 14px; }
.line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; animation: in .35s ease; }
.line span:first-child { font-weight: 600; }
.line small { display: block; color: var(--muted); font-weight: 400; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
.section-title { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ingredients { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.ingredient { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.swap { font: 600 12px var(--sans); border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 3px 8px; cursor: pointer; }
.swapped { color: var(--green); font-weight: 600; }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slot { position: relative; }
.slot input { position: absolute; opacity: 0; }
.slot label { display: block; border: 1px solid var(--line); border-radius: 11px; padding: 8px 10px; font-size: 13px; cursor: pointer; }
.slot label small { display: block; color: var(--muted); }
.slot input:checked + label { border-color: var(--green); background: var(--green-soft); }
.totals { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.totals div { display: flex; justify-content: space-between; }
.totals .grand { font: 600 20px var(--serif); }
.under { color: var(--green); font-size: 12px; font-weight: 600; }
.over { color: var(--tomato); font-size: 12px; font-weight: 600; }
#place-order { border: 0; border-radius: 12px; padding: 12px; font: 600 15px var(--sans); background: var(--saffron); color: #2a1d00; cursor: pointer; }
#place-order:disabled { opacity: .45; cursor: default; }
.done { text-align: center; color: var(--green); font-weight: 600; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding-bottom: 28px; }
</style>
</head>
<body>
<header>
  <div class="logo">Supper<span>.</span></div>
  <p>Plan a dinner. We'll bring the groceries.</p>
</header>

<div class="wrap">
  <main>
    <div class="planner" role="group" aria-label="Your dinner">
      <label for="guests">Guests</label>
      <input id="guests" type="number" min="1" max="20" value="2" aria-label="Number of guests">
      <button id="diet-veg" class="chip" aria-pressed="false">Vegetarian only</button>
      <div class="budget">Budget <b id="budget">$80</b></div>
    </div>
    <div class="grid" id="recipes"></div>
  </main>

  <aside id="menu" aria-label="Your menu">
    <h2>Your menu</h2>
    <div id="lines"><p class="empty">Add a few dishes to start your menu.</p></div>
    <div id="ingredients-wrap" hidden>
      <div class="section-title">Shopping list</div>
      <div class="ingredients" id="ingredients"></div>
    </div>
    <div>
      <div class="section-title">Delivery</div>
      <div class="slots" id="slots"></div>
    </div>
    <div class="totals">
      <div><span>Groceries</span><span id="subtotal">$0.00</span></div>
      <div><span>Delivery</span><span id="delivery">$0.00</span></div>
      <div class="grand"><span>Total</span><span id="total">$0.00</span></div>
      <div id="budget-note"></div>
    </div>
    <button id="place-order" disabled>Place order</button>
    <div id="order-note"></div>
  </aside>
</div>
<footer>Supper is Browsa's demo site. Nothing here is ever ordered or charged.</footer>

<script>
const recipes = [
  { id: 'risotto', name: 'Charred Leek & Lemon Risotto', blurb: 'Silky, bright, finished with herbs.', veg: true, mins: 40, price: 4.20,
    food: 'radial-gradient(circle at 40% 40%, #f3e7b8 0 30%, #e9d68f 31% 55%, #a7c08a 56% 64%, #f3e7b8 65%)',
    ingredients: [['Arborio rice', '500 g'], ['Leeks', '3'], ['Lemons', '2'], ['Parmesan', '120 g', 'parmesan'], ['Vegetable stock', '1.5 l']] },
  { id: 'chicken', name: 'Herb-Roast Chicken Thighs', blurb: 'Crisp skin, garlic, thyme and lemon.', veg: false, mins: 50, price: 5.10,
    food: 'radial-gradient(circle at 55% 45%, #c9893f 0 26%, #a86a2c 27% 45%, #6f8f4e 46% 56%, #e8c58b 57%)',
    ingredients: [['Chicken thighs', '12'], ['Garlic', '1 head'], ['Thyme', '1 bunch']] },
  { id: 'burrata', name: 'Blistered Tomato & Burrata', blurb: 'Warm tomatoes, cold cheese, basil oil.', veg: true, mins: 15, price: 3.40,
    food: 'radial-gradient(circle at 50% 50%, #fbfbf6 0 22%, #d64a37 23% 40%, #f08a3b 41% 52%, #4f8a3f 53% 60%, #fbfbf6 61%)',
    ingredients: [['Cherry tomatoes', '900 g'], ['Burrata', '3'], ['Basil', '2 bunches']] },
  { id: 'shortrib', name: 'Slow-Braised Short Rib', blurb: 'Red wine, shallots, a long afternoon.', veg: false, mins: 210, price: 9.80,
    food: 'radial-gradient(circle at 45% 50%, #5a2a1f 0 35%, #7a3a26 36% 52%, #d9b98a 53%)', ingredients: [['Short ribs', '3 kg']] },
  { id: 'salmon', name: 'Miso-Glazed Salmon', blurb: 'Sweet, salty, ten minutes under the grill.', veg: false, mins: 20, price: 8.60,
    food: 'radial-gradient(circle at 50% 45%, #e98457 0 30%, #c8623a 31% 44%, #2f4f3a 45% 52%, #f1e6d0 53%)', ingredients: [['Salmon fillets', '6']] },
  { id: 'paella', name: 'Saffron Seafood Paella', blurb: 'For the table, straight from the pan.', veg: false, mins: 60, price: 7.40,
    food: 'radial-gradient(circle at 50% 50%, #f2b632 0 40%, #e0902a 41% 50%, #d4553b 51% 56%, #f2b632 57%)', ingredients: [['Bomba rice', '600 g']] },
  { id: 'peach', name: 'Grilled Peach & Fennel', blurb: 'Smoky fruit, shaved fennel, mint.', veg: true, mins: 20, price: 3.10,
    food: 'radial-gradient(circle at 45% 45%, #f5a35c 0 28%, #f7c58b 29% 44%, #cfe0a8 45% 58%, #fbf5e6 59%)', ingredients: [['Peaches', '6']] },
  { id: 'pannacotta', name: 'Burnt Honey Panna Cotta', blurb: 'Wobbly, golden, a little bitter.', veg: true, mins: 25, price: 2.90,
    food: 'radial-gradient(circle at 50% 50%, #fbf3dc 0 34%, #d99a35 35% 42%, #fbf3dc 43%)', ingredients: [['Cream', '1 l'], ['Honey', '200 g']] },
];
const slots = [
  ['slot-fri-evening', 'Friday', '5–7 pm', 4], ['slot-sat-morning', 'Saturday', '9–11 am', 3],
  ['slot-sat-evening', 'Saturday', '5–7 pm', 3], ['slot-sun-morning', 'Sunday', '9–11 am', 5],
];
const state = { guests: 2, vegOnly: false, chosen: [], swapped: false, slot: null, ordered: false };
const $ = (s) => document.querySelector(s);
const money = (n) => '$' + n.toFixed(2);

function renderRecipes() {
  $('#recipes').innerHTML = recipes.map(r => `
    <article class="recipe${state.vegOnly && !r.veg ? ' hidden' : ''}${state.chosen.includes(r.id) ? ' chosen' : ''}" id="recipe-${r.id}">
      <div class="plate" style="background:${r.veg ? '#e9efe2' : '#f1e8dc'}"><div class="dish"><div class="food" style="background:${r.food}"></div></div></div>
      <div class="body">
        <div class="tags">${r.veg ? '<span class="tag">Vegetarian</span>' : ''}<span class="tag time">${r.mins >= 60 ? Math.round(r.mins / 60 * 10) / 10 + ' hr' : r.mins + ' min'}</span></div>
        <h3>${r.name}</h3>
        <p>${r.blurb}</p>
        <div class="row"><span class="price">${money(r.price)} <small>/ serving</small></span>
          <button class="add" id="add-${r.id}" aria-label="${state.chosen.includes(r.id) ? 'Remove' : 'Add'} ${r.name}">${state.chosen.includes(r.id) ? 'On the menu ✓' : 'Add to menu'}</button></div>
      </div>
    </article>`).join('');
  recipes.forEach(r => $('#add-' + r.id).onclick = () => toggle(r.id));
}

function renderMenu() {
  const chosen = recipes.filter(r => state.chosen.includes(r.id));
  $('#lines').innerHTML = chosen.length ? chosen.map(r => `
    <div class="line"><span>${r.name}<small>${state.guests} servings</small></span><span>${money(r.price * state.guests)}</span></div>`).join('')
    : '<p class="empty">Add a few dishes to start your menu.</p>';
  const items = chosen.flatMap(r => r.ingredients);
  $('#ingredients-wrap').hidden = !items.length;
  $('#ingredients').innerHTML = items.map(([name, qty, key]) => {
    if (key === 'parmesan') {
      return state.swapped
        ? `<div class="ingredient" id="ingredient-parmesan"><span class="swapped">Vegetarian hard cheese · ${qty}</span><span>✓</span></div>`
        : `<div class="ingredient" id="ingredient-parmesan"><span>Parmesan · ${qty} <small style="color:var(--tomato)">not vegetarian</small></span><button class="swap" id="swap-parmesan">Swap</button></div>`;
    }
    return `<div class="ingredient"><span>${name}</span><span style="color:var(--muted)">${qty}</span></div>`;
  }).join('');
  const sw = $('#swap-parmesan'); if (sw) sw.onclick = () => { state.swapped = true; renderMenu(); };
  const sub = chosen.reduce((t, r) => t + r.price * state.guests, 0);
  const del = state.slot ? slots.find(s => s[0] === state.slot)[3] : 0;
  $('#subtotal').textContent = money(sub);
  $('#delivery').textContent = money(del);
  $('#total').textContent = money(sub + del);
  $('#budget-note').innerHTML = chosen.length ? (sub + del <= 80 ? `<span class="under">${money(80 - sub - del)} under budget</span>` : `<span class="over">${money(sub + del - 80)} over budget</span>`) : '';
  $('#place-order').disabled = !chosen.length || !state.slot || state.ordered;
  $('#place-order').textContent = state.ordered ? 'Ordered (demo)' : 'Place order';
}

function renderSlots() {
  $('#slots').innerHTML = slots.map(([id, day, time, fee]) => `
    <div class="slot"><input type="radio" name="slot" id="${id}" ${state.slot === id ? 'checked' : ''}>
      <label for="${id}">${day}<small>${time} · ${money(fee)}</small></label></div>`).join('');
  slots.forEach(([id]) => $('#' + id).onchange = () => { state.slot = id; renderMenu(); });
}

function toggle(id) {
  state.chosen = state.chosen.includes(id) ? state.chosen.filter(x => x !== id) : [...state.chosen, id];
  renderRecipes(); renderMenu();
}

$('#guests').oninput = (e) => { state.guests = Math.max(1, Math.min(20, Number(e.target.value) || 1)); renderMenu(); };
$('#diet-veg').onclick = (e) => { state.vegOnly = !state.vegOnly; e.target.setAttribute('aria-pressed', state.vegOnly); renderRecipes(); };
$('#place-order').onclick = () => { state.ordered = true; renderMenu();
  $('#order-note').innerHTML = '<p class="done">All set for Saturday. (This is a demo: nothing was ordered.)</p>'; };
renderRecipes(); renderSlots(); renderMenu();
</script>
</body>
</html>
