<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browsa for Mac</title>
<link rel="icon" href="/demo/img/browsa-icon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #08080a; color: #f4f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; overflow: hidden; }
  .hero { position: relative; height: 100vh; display: grid; place-items: center; text-align: center; overflow: hidden; }
  /* Browsa's liquid metal, slowly breathing behind the title. */
  .metal { position: absolute; inset: -6%; background: url(/demo/img/browsa-metal.jpg) center / cover;
    filter: saturate(1.1); animation: drift 24s ease-in-out infinite alternate; }
  .veil { position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 55% at 50% 52%, rgba(8,8,10,.78), rgba(8,8,10,.35) 70%, rgba(8,8,10,.2)),
                linear-gradient(to bottom, rgba(8,8,10,.15), rgba(8,8,10,.55)); }
  @keyframes drift { from { transform: scale(1.02) translate(-1%, 0); } to { transform: scale(1.08) translate(1%, -1%); } }
  nav { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 28px; padding: 22px 40px; z-index: 2; font-size: 14px; }
  nav .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; margin-right: auto; }
  nav .brand img { width: 26px; height: 26px; }
  nav a { color: rgba(255,255,255,.72); text-decoration: none; }
  .copy { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 0 40px; }
  .copy img { width: 112px; height: 112px; filter: drop-shadow(0 18px 40px rgba(0,0,0,.55)); }
  h1 { margin: 0; font-size: clamp(48px, 7.2vw, 92px); line-height: .98; letter-spacing: -.035em; font-weight: 700; }
  p { margin: 0; max-width: 560px; font-size: 19px; line-height: 1.45; color: rgba(255,255,255,.74); }
  .ctas { display: flex; gap: 12px; margin-top: 8px; }
  .btn { padding: 12px 22px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; }
  .btn.primary { background: #fff; color: #0b0b0d; }
  .btn.ghost { color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); background: rgba(255,255,255,.06); backdrop-filter: blur(10px); }
  .meta { font-size: 13px; color: rgba(255,255,255,.5); }
</style>
</head>
<body>
<section class="hero">
  <div class="metal"></div>
  <div class="veil"></div>
  <nav>
    <span class="brand"><img src="/demo/img/browsa-icon.png" alt="">Browsa</span>
    <a href="#">Features</a><a href="#">Agents</a><a href="#">Library</a><a href="#">Download</a>
  </nav>
  <div class="copy">
    <img src="/demo/img/browsa-icon.png" alt="Browsa">
    <h1>Browsa has come<br>to Mac.</h1>
    <p>A beautiful browser with spaces, notes and a library of plugins, built so you and your agents can work side by side.</p>
    <div class="ctas"><a class="btn primary" href="#">Download for Mac</a><a class="btn ghost" href="#">Watch the film</a></div>
    <span class="meta">Free · macOS 26 Tahoe and later · Apple silicon</span>
  </div>
</section>
</body>
</html>
