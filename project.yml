# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
# The .xcodeproj is git-ignored; this file is the source of truth.
name: Browsa
options:
  bundleIdPrefix: com.orriginal
  deploymentTarget:
    iOS: "27.1"
    macOS: "26.0"
  xcodeVersion: "27.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: UAU4449Y7J
packages:
  BrowserKit:
    path: Packages/BrowserKit
targets:
  Browsa:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - App/Browsa.icon
    dependencies:
      - package: BrowserKit
        product: BrowserCore
      - package: BrowserKit
        product: Suggest
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Browsa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only uses the system's HTTPS, which is exempt, so uploads skip the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Downloads land in Documents/Downloads and show up in the Files app.
        # Audio and picture-in-picture keep going when you leave the app, like Safari.
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: Websites you allow can use the camera, for example for video calls.
        NSMicrophoneUsageDescription: Websites you allow can use the microphone, for example for video calls.
        NSLocationWhenInUseUsageDescription: Websites you allow can see your location, for example to show nearby places.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets the app appear in Settings > Default Browser App once Apple grants the
        # com.apple.developer.web-browser entitlement (request it when you're ready to ship).
        CFBundleURLTypes:
          - CFBundleURLName: Web
            CFBundleURLSchemes: [http, https]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orriginal.browsa
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Browsa
    scheme:
      testTargets:
        - package: BrowserKit/SuggestTests
        - BrowsaUITests
  # Browsa for Mac: an Arc-style window on the engine-neutral BrowserEngine API (WebKit for now).
  BrowsaMac:
    type: application
    platform: macOS
    sources:
      - Mac/Sources
      - Mac/Resources
      - App/Browsa.icon
    dependencies:
      - package: BrowserKit
        product: BrowserCore
      - package: BrowserKit
        product: Suggest
      - package: BrowserKit
        product: BrowserEngine
      - package: BrowserKit
        product: WebKitEngine
      - package: BrowserKit
        product: Extensibility
    entitlements:
      path: Mac/Browsa.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # The agent endpoint, on 127.0.0.1 only.
        com.apple.security.network.server: true
        # Unpacked extension folders the user picks stay readable across launches.
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Browsa
        CFBundleName: Browsa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Websites you allow can use the camera, for example for video calls.
        NSMicrophoneUsageDescription: Websites you allow can use the microphone, for example for video calls.
        NSLocationUsageDescription: Websites you allow can see your location, for example to show nearby places.
        # Lets Browsa be picked as the default web browser in System Settings > Desktop & Dock.
        CFBundleURLTypes:
          - CFBundleURLName: Web
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.html, public.xhtml]
    settings:
      base:
        PRODUCT_NAME: Browsa
        # Same ID as the iPhone app, so the two can be one universal purchase.
        PRODUCT_BUNDLE_IDENTIFIER: com.orriginal.browsa
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: Browsa
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
  BrowsaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: Browsa
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.orriginal.browsa.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
