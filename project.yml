# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
# The .xcodeproj is git-ignored; this file is the source of truth.
name: Browsa
options:
  bundleIdPrefix: com.orriginal
  deploymentTarget:
    iOS: "27.1"
    macOS: "26.0"
  xcodeVersion: "27.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: UAU4449Y7J
packages:
  BrowserKit:
    path: Packages/BrowserKit
targets:
  Browsa:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - App/Browsa.icon
    dependencies:
      - package: BrowserKit
        product: BrowserCore
      - package: BrowserKit
        product: Suggest
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Browsa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only uses the system's HTTPS, which is exempt, so uploads skip the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Downloads land in Documents/Downloads and show up in the Files app.
        # Audio and picture-in-picture keep going when you leave the app, like Safari.
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: Websites you allow can use the camera, for example for video calls.
        NSMicrophoneUsageDescription: Websites you allow can use the microphone, for example for video calls.
        NSLocationWhenInUseUsageDescription: Websites you allow can see your location, for example to show nearby places.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets the app appear in Settings > Default Browser App once Apple grants the
        # com.apple.developer.web-browser entitlement (request it when you're ready to ship).
        CFBundleURLTypes:
          - CFBundleURLName: Web
            CFBundleURLSchemes: [http, https]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orriginal.browsa
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Browsa
    scheme:
      testTargets:
        - package: BrowserKit/SuggestTests
        - BrowsaUITests
  # Browsa for Mac: an Arc-style window on the engine-neutral BrowserEngine API (WebKit for now).
  BrowsaMac:
    type: application
    platform: macOS
    sources:
      - Mac/Sources
      - Mac/Resources
      - App/Browsa.icon
    dependencies:
      - package: BrowserKit
        product: BrowserCore
      - package: BrowserKit
        product: Suggest
      - package: BrowserKit
        product: BrowserEngine
      - package: BrowserKit
        product: WebKitEngine
      - package: BrowserKit
        product: Extensibility
    entitlements:
      path: Mac/Browsa.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # The agent endpoint, on 127.0.0.1 only.
        com.apple.security.network.server: true
        # Unpacked extension folders the user picks stay readable across launches.
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: $(BROWSA_APP_NAME)
        CFBundleName: $(BROWSA_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Websites you allow can use the camera, for example for video calls.
        NSMicrophoneUsageDescription: Websites you allow can use the microphone, for example for video calls.
        NSLocationUsageDescription: Websites you allow can see your location, for example to show nearby places.
        # Lets Browsa be picked as the default web browser in System Settings > Desktop & Dock.
        CFBundleURLTypes:
          - CFBundleURLName: Web
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.html, public.xhtml]
    settings:
      base:
        PRODUCT_NAME: Browsa
        # Same ID as the iPhone app, so the two can be one universal purchase. Only Release
        # builds use it: that's the copy in /Applications (tools/install-mac.sh), whose sandbox
        # container holds Josh's sign-ins, tabs and extensions.
        PRODUCT_BUNDLE_IDENTIFIER: com.orriginal.browsa
        BROWSA_APP_NAME: Browsa
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: Browsa
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
      configs:
        # Xcode runs and test builds get their own ID, so their data lives in a separate container
        # and never touches (or overwrites) the daily-driver app's.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.orriginal.browsa.dev
          BROWSA_APP_NAME: Browsa Dev
    postBuildScripts:
      # Only the daily-driver build offers itself as a web browser. Dev and test builds drop the
      # http/https and HTML handlers, so they never show up in System Settings' default browser list
      # or catch links from other apps.
      - name: Drop browser handlers outside the release build
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PRODUCT_BUNDLE_IDENTIFIER" != "com.orriginal.browsa" ]; then
            plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :CFBundleDocumentTypes" "$plist" 2>/dev/null || true
          fi
  # SpikeBrowsa: the Mac UI over mock data, with a control channel Claude drives (see Spike/README.md).
  # Its own bundle ID keeps its data apart from the daily driver; it never registers as a browser.
  SpikeBrowsa:
    type: application
    platform: macOS
    sources:
      - path: Mac/Sources
      - Mac/Resources
      - App/Browsa.icon
      - Spike/Sources
    dependencies:
      - package: BrowserKit
        product: BrowserCore
      - package: BrowserKit
        product: Suggest
      - package: BrowserKit
        product: BrowserEngine
      - package: BrowserKit
        product: WebKitEngine
      - package: BrowserKit
        product: Extensibility
    entitlements:
      path: Spike/SpikeBrowsa.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # The agent endpoint, the control channel and the mock dev servers, all on 127.0.0.1.
        com.apple.security.network.server: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: Spike/Info.plist
      properties:
        CFBundleDisplayName: SpikeBrowsa
        CFBundleName: SpikeBrowsa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        # Not the daily driver's 47913, so both can run at once.
        BrowsaAgentPort: 47914
        SpikeControlPort: 47930
    settings:
      base:
        PRODUCT_NAME: SpikeBrowsa
        PRODUCT_BUNDLE_IDENTIFIER: com.orriginal.browsa.spike
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: Browsa
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SPIKE
  BrowsaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: Browsa
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.orriginal.browsa.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
