<!doctype html><meta charset="utf-8"><title>Browsa probe</title><style>body{margin:0}#run{position:fixed;inset:0;width:100%;height:100%;opacity:.15}</style><h1>Browsa platform probe</h1><pre id="out"></pre><button id="run">Run passkey requests</button>
<script>
const out = {};
const toBytes = (s) => new TextEncoder().encode(s);
async function attempt(fn, ms = 6000) {
  const started = performance.now();
  try {
    const value = await Promise.race([fn().then(() => "resolved"), new Promise((_, no) => setTimeout(() => no(new Error("no response (hung or waiting on system UI)")), ms))]);
    return { value, ms: Math.round(performance.now() - started) };
  } catch (error) {
    return { name: error.name, message: error.message, ms: Math.round(performance.now() - started) };
  }
}
(async () => {
  out.secureContext = isSecureContext;
  out.hasPublicKeyCredential = typeof PublicKeyCredential !== "undefined";
  if (out.hasPublicKeyCredential) {
    out.platformAuthenticator = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    out.conditionalMediation = await PublicKeyCredential.isConditionalMediationAvailable?.();
    out.documentFocused = document.hasFocus();
    await new Promise((go) => document.getElementById("run").addEventListener("click", go, { once: true }));
    out.documentFocusedAtClick = document.hasFocus();
    const rp = { id: location.hostname, name: "Browsa probe" };
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const user = { id: toBytes("probe"), name: "probe", displayName: "probe" };
    out.create = await attempt(() => navigator.credentials.create({ publicKey: { rp, challenge, user, pubKeyCredParams: [{ type: "public-key", alg: -7 }], authenticatorSelection: { residentKey: "required", userVerification: "required" } } }));
    out.get = await attempt(() => navigator.credentials.get({ publicKey: { rpId: rp.id, challenge } }));
    out.securityKeyCreate = await attempt(() => navigator.credentials.create({ publicKey: { rp, challenge, user, pubKeyCredParams: [{ type: "public-key", alg: -7 }], authenticatorSelection: { authenticatorAttachment: "cross-platform" } } }));
  }
  out.dnrBlocked = await fetch("/blocked-by-extension.txt").then((r) => "not blocked: " + r.status, (e) => "blocked: " + e.message);
  window.__probe = out;
  document.getElementById("out").textContent = JSON.stringify(out, null, 2);
  webkit.messageHandlers.spike?.postMessage(out);
})();
</script>
