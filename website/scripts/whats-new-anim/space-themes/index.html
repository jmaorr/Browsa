<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../kit/kit.css"><link rel="stylesheet" href="../kit/sites.css"><script src="../kit/kit.js"></script><script src="../kit/sites.js"></script>
<style>
  .win { left:160px; top:250px; width:1280px; height:640px; transition:none; }
  .side { width:300px; }
  .page { left:312px; }
  .page .hero { height:200px; border-radius:12px; background:#efeeeb; margin-bottom:24px; }
  .page .bar { margin-bottom:16px; }
  .win.dark .row .in, .win.dark .sect { color:#e8e6e3; } .win.dark .favs span { background: rgb(255 255 255 / .1); }
  .win.dark .row.sel .in { background: rgb(255 255 255 / .14); }
  .win.dark .page { background:#1b1c1f; }
  .spaces { position:absolute; left:14px; right:14px; bottom:18px; display:flex; gap:14px; justify-content:center; }
  .spaces span { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; }
  .spaces svg { width:18px; height:18px; }
  .pop { position:absolute; left:500px; top:300px; width:400px; padding:22px; box-sizing:border-box; border-radius:20px; background:#fafaf9;
    box-shadow: 0 0 0 1px rgb(0 0 0 / .08), 0 24px 60px -14px rgb(0 0 0 / .35); }
  .pop h4 { margin:0 0 10px; font-size:15px; font-weight:600; color:#6e6c68; }
  .chips { display:flex; justify-content:space-between; margin-bottom:14px; }
  .chips i { width:28px; height:28px; border-radius:50%; display:block; box-shadow: 0 0 0 0 transparent; }
  .strip { position:relative; height:24px; border-radius:12px; margin-bottom:22px; }
  .strip b { position:absolute; top:-2px; width:28px; height:28px; border-radius:50%; box-sizing:border-box; border:4px solid #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .3); margin-left:-14px; }
  .slider { position:relative; height:6px; border-radius:3px; background:#dddcd9; margin:14px 0 6px; }
  .slider .fill { position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:#0a84ff; }
  .slider b { position:absolute; top:-9px; width:24px; height:24px; margin-left:-12px; border-radius:50%; background:#fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .12), 0 2px 5px rgb(0 0 0 / .2); }
  .ends { display:flex; justify-content:space-between; font-size:13px; color:#8a8884; margin-bottom:20px; }
  .tabs { position:relative; display:flex; padding:4px; border-radius:22px; background: rgb(0 0 0 / .05); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1); margin-bottom:20px; }
  .tabs span { position:relative; z-index:1; flex:1; height:34px; display:flex; align-items:center; justify-content:center; gap:7px; font-size:15px; color:#6e6c68; }
  .tabs span.on { color:#1d1d1f; font-weight:600; }
  .tabs .lens { position:absolute; top:4px; height:34px; border-radius:17px; background:#fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .06), 0 2px 6px rgb(0 0 0 / .12); }
  .revert { margin-left:auto; width:max-content; padding:0 16px; height:32px; border-radius:16px; display:flex; align-items:center; font-size:14px; color:#a7a5a1; background: rgb(0 0 0 / .05); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .06); }
  .pop.dark { background:#28282a; box-shadow: 0 0 0 1px rgb(255 255 255 / .1), 0 24px 60px -14px rgb(0 0 0 / .5); }
  .pop.dark h4, .pop.dark .ends { color:#a09e9a; } .pop.dark .slider { background:#4a4a4d; } .pop.dark .chips i { --ring:#28282a; }
  .pop.dark .tabs { background: rgb(255 255 255 / .06); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .12); } .pop.dark .tabs span { color:#a09e9a; } .pop.dark .tabs span.on { color:#fff; }
  .pop.dark .lens { background: rgb(255 255 255 / .18); } .pop.dark .revert { background: rgb(255 255 255 / .06); color:#77756f; }
  .cursor { position:absolute; width:22px; height:30px; z-index:5; }
  .cap { position:absolute; left:0; right:0; top:920px; text-align:center; font-size:24px; font-weight:500; }
</style></head>
<body><div class="stage" id="stage">
  <div class="label">Give each space its own colour</div>
  <div class="sub">Pick a colour, make it lighter or darker, and keep a space light or dark.</div>
  <div class="win" id="win"><div class="side" id="side"></div>
    <div class="page" id="page"></div>
  </div>
  <div class="pop" id="pop">
    <h4>Colour</h4><div class="chips" id="chips"></div>
    <div class="strip" id="strip"><b id="knob"></b></div>
    <h4>Shade</h4><div class="slider"><div class="fill" id="fill"></div><b id="sk"></b></div><div class="ends"><span>Lighter</span><span>Darker</span></div>
    <h4>Appearance</h4>
    <div class="tabs" id="tabs"><div class="lens" id="lens"></div><span id="t0"><svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 3.5a8.5 8.5 0 010 17z" fill="currentColor"/></svg> Auto</span><span id="t1"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg> Light</span><span id="t2"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg> Dark</span></div>
    <div class="revert">Revert to Original</div>
  </div>
  <svg class="cursor" id="cursor" viewBox="0 0 22 30"><path d="M2 2v22l6-6 4 9 4-2-4-9h8z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <div class="cap" id="cap"></div>
</div>
<script>
const hsl = (h, s, l) => `hsl(${h} ${s * 100}% ${l * 100}%)`;
const PRESETS = [0, 24, 46, 135, 208, 236, 276, 318];
document.getElementById("chips").innerHTML = PRESETS.map((h) => `<i style="background:${hsl(h, .55, .55)}"></i>`).join("");
document.getElementById("strip").insertAdjacentHTML("afterbegin", "");
document.getElementById("strip").style.background = `linear-gradient(90deg, ${Array.from({ length: 13 }, (_, i) => hsl(i * 30, .55, .6)).join(",")})`;
document.getElementById("side").innerHTML = `
  <div class="lights"><i></i><i></i><i></i></div>
  <div class="favs">${["mail.google.com","calendar.google.com","figma.com","notion.so"].map(f => `<span><img src="${fav(f)}"></span>`).join("")}</div>
  <div class="sect">Pinned</div>${row(fav("figma.com"), "Browsa site · Figma")}${row(fav("linear.app"), "My issues · Linear", "sel")}
  <div class="sect">Today</div>${row(fav("airbnb.com"), "Cabin in Lofoten · Airbnb")}${row(fav("spotify.com"), "Focus playlist · Spotify")}${row(fav("nytimes.com"), "The New York Times")}
  <div class="spaces"><span id="sp1"></span><span></span><span></span></div>`;
document.getElementById("page").innerHTML = site("linear");
const HOUSE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>`;
document.querySelectorAll(".spaces span").forEach((s, i) => { s.innerHTML = HOUSE; s.style.color = "#8a8884"; });
const $ = (id) => document.getElementById(id);
// Where things are, in stage coordinates (the popover is at 500,300; inner padding 22).
const chipX = (i) => 522 + 14 + i * ((356 - 28) / 7), CHIP_Y = 300 + 22 + 25 + 14;
const STRIP = { x: 522, w: 356, y: 300 + 22 + 25 + 42 + 12 }, SLIDER = { x: 522, w: 356, y: 300 + 172 };
const TABY = 300 + 268;
// The story: Red → Blue chip → along the strip to teal → shade darker → Dark → Auto.
const KEYS = [
  { t: 0.9, hue: 0 }, { t: 2.0, hue: 208 }, { t: 3.4, hue: 165, strip: true }, { t: 4.4, hue: 165 }];
window.TOTAL = 10.6;
const CAPS = [[0.6, 3.0, "Pick a colour"], [3.2, 5.6, "Lighter or darker"], [6.0, 9.8, "Keep a space light or dark"]];
window.render = (t) => {
  // Hue: chip red, chip blue, then drag the strip to 165.
  let hue = 236, preset = -1;
  if (t >= 0.9) { hue = 0; preset = 0; }
  if (t >= 2.0) { hue = 208; preset = 4; }
  const drag = eio(ph(t, 2.9, 0.9)); if (t >= 2.9) { hue = mix(208, 165, drag); preset = -1; }
  const shade = mix(0.3, 0.75, eio(ph(t, 4.2, 1.1)));
  const dark = t >= 7.0 && t < 9.0;
  const sw = eio(ph(t, 6.6, 0.4)), back = eio(ph(t, 8.6, 0.4));
  // Window tint: the colour at its shade, half over the material.
  const l = dark ? 0.32 - shade * 0.16 : 0.88 - shade * 0.33;
  const base = dark ? "#2a2a2c" : "#ecebe8";
  $("win").style.background = `color-mix(in srgb, ${hsl(hue, dark ? .44 : .55, l)} 50%, ${base})`;
  $("win").classList.toggle("dark", dark); $("pop").classList.toggle("dark", dark);
  $("sp1").style.background = hsl(hue, .55, .55); $("sp1").style.color = "#fff";
  // Chips: a ring on the picked one.
  document.querySelectorAll(".chips i").forEach((c, i) => (c.style.boxShadow = i === preset ? `0 0 0 3px ${dark ? "#28282a" : "#fafaf9"}, 0 0 0 5px ${dark ? "rgb(255 255 255 / .6)" : "rgb(0 0 0 / .45)"}` : "none"));
  $("knob").style.left = (hue / 360) * 100 + "%"; $("knob").style.background = hsl(hue, .55, .55);
  $("sk").style.left = shade * 100 + "%"; $("fill").style.width = shade * 100 + "%";
  // Appearance: Auto → Dark → Auto, the lens sliding.
  const seg = 356 / 3 - 2.7, pos = mix(mix(0, 2, sw), 0, back);
  $("lens").style.left = 4 + pos * (seg + 0) + "px"; $("lens").style.width = seg + "px";
  const on = Math.round(pos); ["t0", "t1", "t2"].forEach((id, i) => $(id).classList.toggle("on", i === on));
  // Cursor path.
  // Each point is where the cursor arrives, and when; it travels for up to 0.7 s before that.
  const pts = [[0, 760, 700], [0.8, chipX(0), CHIP_Y], [1.9, chipX(4), CHIP_Y], [2.85, STRIP.x + STRIP.w * 208 / 360, STRIP.y], [3.8, STRIP.x + STRIP.w * 165 / 360, STRIP.y],
    [4.15, SLIDER.x + SLIDER.w * 0.3, SLIDER.y], [5.3, SLIDER.x + SLIDER.w * 0.75, SLIDER.y], [6.5, 522 + seg * 2.5, TABY], [8.5, 522 + seg * 0.5, TABY], [10.6, 522 + seg * 0.5, TABY]];
  let i = pts.findIndex((p) => p[0] > t); if (i < 0) i = pts.length - 1; if (i === 0) i = 1;
  const [t0, x0, y0] = pts[i - 1], [t1, x1, y1] = pts[i], go = Math.max(t0, t1 - (i === 4 || i === 6 ? 1.1 : 0.7));
  const f = i === 4 || i === 6 ? clamp((t - go) / (t1 - go)) : eio(clamp((t - go) / (t1 - go)));
  $("cursor").style.transform = `translate(${mix(x0, x1, f)}px, ${mix(y0, y1, f)}px)`;
  const cap = $("cap"), k = CAPS.find(([s, e]) => t >= s && t < e);
  cap.textContent = k ? k[2] : "";
  cap.style.opacity = k ? Math.min(eo(ph(t, k[0], 0.35)), 1 - ph(t, k[1] - 0.3, 0.3)) : 0;
  $("stage").style.opacity = loopFade(t, TOTAL);
};
render(0);
</script></body></html>
