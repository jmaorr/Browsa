<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/kit.css"><link rel="stylesheet" href="../../kit/sites.css"><link rel="stylesheet" href="../shared/library.css"><script src="../../kit/kit.js"></script><script src="../../kit/sites.js"></script><script src="../shared/library.js"></script>
<style>
  .wall { background-image:url(../wallpapers/notes.jpg); }
  #hl { background-image:linear-gradient(rgb(255 204 0 / .45), rgb(255 204 0 / .45)); background-repeat:no-repeat; border-radius:3px; }
  .caret { display:inline-block; width:2px; height:18px; background:#0a84ff; vertical-align:-3px; margin-left:1px; }
</style></head>
<body><div class="stage" id="stage">
  <div class="wall"></div>
  <div class="win"><div class="side" id="side"></div><div class="page" id="page"></div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
$("side").innerHTML = sidebar({
  addr: `${img("github.com").replace("<img", '<img style="width:18px;height:18px;border-radius:4px"')}github.com/jmaorr/Browsa/pull/88`,
  body: `<div class="sect">Pinned</div>${R(img("linear.app"), "My issues · Linear")}${R(img("github.com"), "Mac 1.2 · Pull request #88", "sel")}${R(img("figma.com"), "Library · Figma")}
    <div class="sect">Today</div>${R(img("stripe.com"), "Payments · Stripe")}${R(img("notion.so"), "Standup notes · Notion")}`,
  foot: {},
});
$("page").innerHTML = site("github") + `
  <div class="pin" id="pin"></div>
  <div class="note" id="note"><div class="who"><i style="background:#c9b6e8"></i>You</div><span id="typed"></span>
    <div class="rep" id="rep"><div class="who"><i style="background:#d97757"></i>Claude Code</div>Added the mini-player to the What's New clip.<div class="done">✓ Resolved</div></div></div>
  <div class="ptr" id="ptr">${POINTER("#161513")}</div>`;
const p = document.querySelector(".cmt .t p");
p.innerHTML = `<span id="hl">${p.textContent}</span>`;
const page = $("page").getBoundingClientRect(), r = $("hl").getBoundingClientRect();
const X0 = r.left - page.left, Y0 = r.top - page.top, W = r.width, H = r.height;
const TEXT = "Can the clip show the mini-player too?";

window.TOTAL = 9;
window.render = (t) => {
  // Drag across the line, then a pin and a note.
  const sel = eio(ph(t, 0.9, 1.0));
  $("hl").style.backgroundSize = `${sel * 100}% 100%`;
  const m = eio(ph(t, 0.3, 0.6));
  $("ptr").style.left = mix(X0 + 220, X0, m) + mix(0, W, sel) + "px";
  $("ptr").style.top = mix(Y0 + 140, Y0 + 4, m) + "px";
  $("ptr").style.opacity = Math.min(ph(t, 0.2, 0.2), 1 - ph(t, 2.4, 0.3));
  const pinIn = eo(ph(t, 2.1, 0.3));
  $("pin").style.left = X0 + W + 8 + "px"; $("pin").style.top = Y0 - 18 + "px";
  $("pin").style.opacity = pinIn * (1 - ph(t, 8.4, 0.3));
  $("pin").style.transform = `scale(${0.5 + 0.5 * pinIn})`;
  $("pin").style.background = t > 6.6 ? "linear-gradient(#5fd08f,#2f9e63)" : "linear-gradient(#ffd34d,#f2a900)";
  const nIn = eo(ph(t, 2.3, 0.35));
  $("note").style.left = Math.min(X0 + W - 120, 560) + "px"; $("note").style.top = Y0 + 34 + "px";
  $("note").style.opacity = nIn * (1 - ph(t, 8.3, 0.4));
  $("note").style.transform = `translateY(${(1 - nIn) * 8}px)`;
  const n = Math.min(TEXT.length, Math.max(0, Math.floor((t - 2.7) / 0.055)));
  $("typed").innerHTML = TEXT.slice(0, n) + (t < 5.0 ? `<span class="caret" style="opacity:${Math.floor(t * 2.4) % 2 ? 1 : 0.2}"></span>` : "");
  const rep = eo(ph(t, 5.4, 0.5));
  $("rep").style.maxHeight = rep * 140 + "px"; $("rep").style.opacity = rep;
  $("rep").querySelector(".done").style.opacity = ph(t, 6.6, 0.3);
  $("hl").style.opacity = 1;
  // Only the window's contents fade at the loop point; the desktop and window stay put.
  const lf = 0.15 + 0.85 * loopFade(t, TOTAL); $("side").style.opacity = lf; $("page").style.opacity = lf;
};
render(0);
</script></body></html>
