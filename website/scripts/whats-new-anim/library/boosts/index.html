<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/kit.css"><link rel="stylesheet" href="../../kit/sites.css"><link rel="stylesheet" href="../shared/library.css"><script src="../../kit/kit.js"></script><script src="../../kit/sites.js"></script><script src="../shared/library.js"></script>
<style>
  .wall { background-image:url(../shared/wallpaper.jpg); background-position:center 35%; }
  .win { --tint:#ff2d55; }
  #site { position:absolute; inset:0; transition:none; }
  #site .no h1, #site .no h3, #site .no li, #site .no .todo, #site .no .prop { transition:none; }
  #tintbg { position:absolute; inset:0; background:#f8f1e4; }
  /* The Boost panel, floating over the page like Browsa's other panels. */
  .boost { position:absolute; left:520px; top:54px; width:360px; padding:16px; border-radius:20px; font-size:15px;
    background: rgb(255 255 255 / .92); box-shadow: 0 0 0 1px rgb(0 0 0 / .08), 0 24px 48px -16px rgb(0 0 0 / .35); }
  .boost .hd { display:flex; align-items:center; gap:10px; font-weight:600; font-size:17px; }
  .boost .hd small { font-weight:500; color:#77736c; font-size:14px; }
  .boost .sw { margin-left:auto; width:42px; height:25px; border-radius:13px; background:#d8d6d1; position:relative; }
  .boost .sw i { position:absolute; top:2.5px; left:2.5px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgb(0 0 0 / .25); }
  .boost .lbl { margin:16px 0 8px; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#77736c; }
  .seg { display:flex; gap:6px; }
  .seg span { flex:1; height:34px; border-radius:17px; display:grid; place-items:center; background:rgb(0 0 0 / .05); font-size:15px; }
  .seg span.on { background:#161513; color:#fff; }
  .dots { display:flex; gap:10px; }
  .dots i { width:28px; height:28px; border-radius:50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1); }
  .dots i.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #161513; }
  .zap { margin-top:16px; display:flex; align-items:center; gap:8px; height:36px; padding:0 14px; border-radius:18px; background:rgb(0 0 0 / .05); width:max-content; font-weight:500; }
  .zap.on { background:#ff3b30; color:#fff; }
  .hl { position:absolute; border-radius:8px; box-shadow: 0 0 0 2px #ff3b30, 0 0 0 6px rgb(255 59 48 / .18); background: rgb(255 59 48 / .06); }
  #site.serif .no h1, #site.serif .no h3, #site.serif .no li, #site.serif .no .todo, #site.serif .no .prop, #site.serif .no .crumb { font-family:'New York', 'Liberation Serif', serif !important; letter-spacing:0; }
  .ptr { position:absolute; width:30px; height:30px; }
  .ring { position:absolute; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; border:3px solid rgb(22 21 19 / .45); }
</style></head>
<body><div class="stage" id="stage">
  <div class="wall"></div>
  <div class="win"><div class="side" id="side"></div><div class="page" id="page"></div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
$("side").innerHTML = sidebar({
  addr: `${img("notion.so").replace("<img", '<img style="width:18px;height:18px;border-radius:4px"')}notion.so/browsa/standup`,
  space: 1, tint: "#ff2d55",
  body: `<div class="sect">Pinned</div>${R(img("linear.app"), "My issues · Linear")}${R(img("github.com"), "Pull requests · GitHub")}
    <div class="sect">Today</div>${R(img("notion.so"), "Standup notes · Notion", "sel")}${R(img("figma.com"), "Library · Figma")}`,
  foot: {},
});
$("page").innerHTML = `<div id="tintbg"></div><div id="site">${site("notion")}</div>
  <div class="hl" id="hl"></div>
  <div class="boost" id="boost">
    <div class="hd">${img("notion.so").replace("<img", '<img style="width:22px;height:22px;border-radius:5px"')}Boost<small>notion.so</small><span class="sw" id="sw"><i id="knob"></i></span></div>
    <div class="lbl">Font</div><div class="seg"><span id="f0" class="on">Default</span><span id="f1" style="font-family:'New York',Georgia,serif">Serif</span><span id="f2" style="font-family:ui-monospace,Menlo,monospace">Mono</span></div>
    <div class="lbl">Page colour</div><div class="dots"><i class="on" style="background:#fff"></i><i id="c1" style="background:#f8f1e4"></i><i style="background:#e9f2ec"></i><i style="background:#e8eef8"></i><i style="background:#1c1c1e"></i></div>
    <div class="zap" id="zap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Zap something</div>
  </div>
  <div class="ring" id="ring"></div>
  <div class="ptr" id="ptr">${POINTER("#161513")}</div>`;

const page = $("page").getBoundingClientRect();
const at = (el) => { const r = el.getBoundingClientRect(); return [r.left - page.left + r.width / 2, r.top - page.top + r.height / 2, r]; };
const props = [...document.querySelectorAll(".no .prop")];
const crumb = document.querySelector(".no .crumb");
const pr = props[1].getBoundingClientRect();
const P = { f1: at($("f1")), c1: at($("c1")), zap: at($("zap")), tgt: [pr.left - page.left + 160, pr.top - page.top + pr.height / 2] };

window.TOTAL = 9;
window.render = (t) => {
  const bIn = eo(ph(t, 0.5, 0.4));
  $("boost").style.opacity = bIn * (1 - ph(t, 8.2, 0.3));
  $("boost").style.transform = `translateY(${(1 - bIn) * -8}px) scale(${0.97 + 0.03 * bIn})`;
  const on = t > 1.4;
  $("sw").style.background = on ? "#34c759" : "#d8d6d1"; $("knob").style.left = on ? "19.5px" : "2.5px";

  // Pointer path: switch, Serif, warm page colour, Zap, then the Attendees line.
  const stops = [[0.6, [700, 420]], [1.1, [P.f1[0] + 150, 76]], [1.9, [P.f1[0], P.f1[1]]], [3.3, [P.c1[0], P.c1[1]]], [4.7, [P.zap[0], P.zap[1]]], [5.6, P.tgt], [7.2, [700, 470]]];
  let x = stops[0][1][0], y = stops[0][1][1];
  for (let i = 1; i < stops.length; i++) { const m = eio(ph(t, stops[i - 1][0] + 0.15, stops[i][0] - stops[i - 1][0] - 0.3)); x = mix(x, stops[i][1][0], m); y = mix(y, stops[i][1][1], m); }
  $("ptr").style.left = x + "px"; $("ptr").style.top = y + "px";
  $("ptr").style.opacity = Math.min(ph(t, 0.6, 0.3), 1 - ph(t, 7.6, 0.4));
  const clicks = [[1.25, [P.f1[0] + 150, 76]], [2.05, P.f1], [3.45, P.c1], [4.85, P.zap], [6.0, P.tgt]];
  let ring = 0;
  for (const [ct, p] of clicks) if (t > ct && t < ct + 0.45) { const k = ph(t, ct, 0.45); ring = 1 - k; $("ring").style.left = p[0] + "px"; $("ring").style.top = p[1] + "px"; $("ring").style.transform = `scale(${0.5 + k})`; }
  $("ring").style.opacity = ring;

  // Serif, then a warm page.
  const serif = t > 2.05;
  ["f0", "f1"].forEach((id, i) => $(id).classList.toggle("on", i === (serif ? 1 : 0)));
  $("site").classList.toggle("serif", serif);
  $("site").style.opacity = t > 2.05 && t < 2.35 ? 0.4 + 0.6 * ph(t, 2.05, 0.3) : 1;
  $("c1").classList.toggle("on", t > 3.45); document.querySelector(".dots i").classList.toggle("on", t <= 3.45);
  $("tintbg").style.opacity = eo(ph(t, 3.45, 0.5));
  document.querySelector("#site .site").style.background = "transparent";

  // Zap: hover outlines the line, a click takes it away.
  $("zap").classList.toggle("on", t > 4.85 && t < 6.4);
  const r = props[1].getBoundingClientRect();
  const hov = t > 5.4 && t < 6.2;
  $("hl").style.left = r.left - page.left - 8 + "px"; $("hl").style.top = r.top - page.top - 4 + "px";
  const last = props[1].lastElementChild.getBoundingClientRect();
  $("hl").style.width = last.right - r.left + 16 + "px"; $("hl").style.height = r.height + 8 + "px";
  $("hl").style.opacity = hov ? Math.min(ph(t, 5.4, 0.2), 1 - ph(t, 6.0, 0.2)) : 0;
  const gone = eio(ph(t, 6.05, 0.5));
  props[1].style.opacity = 1 - gone; props[1].style.transform = `scale(${1 - 0.06 * gone})`; props[1].style.transformOrigin = "left center";
  props[1].style.maxHeight = (1 - gone) * 30 + "px"; props[1].style.marginBottom = (1 - gone) * 6 + "px"; props[1].style.overflow = "hidden";
  // Only the window's contents fade at the loop point; the desktop and window stay put.
  const lf = 0.15 + 0.85 * loopFade(t, TOTAL); $("side").style.opacity = lf; $("page").style.opacity = lf;
};
render(0);
</script></body></html>
