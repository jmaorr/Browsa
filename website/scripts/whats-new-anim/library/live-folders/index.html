<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/kit.css"><link rel="stylesheet" href="../../kit/sites.css"><link rel="stylesheet" href="../shared/library.css"><script src="../../kit/kit.js"></script><script src="../../kit/sites.js"></script><script src="../shared/library.js"></script>
<style>
  .wall { background-image:url(../wallpapers/live-folders.jpg); }
  .win { --tint:#af52de; }
  /* A live folder: folder row with its live badge and count, PR rows inside. */
  .fold .in { font-weight:500; }
  .fold svg { flex:none; }
  .fold .n { margin-left:auto; min-width:24px; height:22px; padding:0 7px; box-sizing:border-box; border-radius:11px; background: rgb(175 82 222 / .16); color:#7e2fa6; font-size:13px; font-weight:600; display:grid; place-items:center; font-variant-numeric:tabular-nums; }
  .kids { margin-left:22px; padding-left:8px; border-left:1.5px solid rgb(0 0 0 / .08); }
  .kids .row .in { font-size:16px; height:36px; }
  .kids .row .in em { margin-left:auto; font-style:normal; font-size:12px; font-weight:600; padding:2px 8px; border-radius:9px; }
  .rev { background: rgb(10 132 255 / .12); color:#0a6bd6; }
  .mer { background: rgb(130 80 223 / .14); color:#6e40c9; }
  .spin { width:14px; height:14px; border-radius:50%; border:2px solid rgb(175 82 222 / .25); border-top-color:#af52de; box-sizing:border-box; }
  .toast { position:absolute; left:250px; top:14px; display:flex; align-items:center; gap:10px; height:40px; padding:0 18px; border-radius:20px; font-size:16px; font-weight:500;
    background: rgb(255 255 255 / .94); box-shadow: 0 0 0 1px rgb(0 0 0 / .08), 0 10px 24px -10px rgb(0 0 0 / .3); white-space:nowrap; }
</style></head>
<body><div class="stage" id="stage">
  <div class="wall"></div>
  <div class="win"><div class="side" id="side"></div><div class="page" id="page"></div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const GH = img("github.com");
const FOLDER = `<svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 014.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0121 8.7v9.8a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 18.5z" fill="#af52de" opacity=".85"/></svg>`;
const PRS = [
  ["p1", "Pinned folders", "#107", ""],
  ["p2", "Split View polish", "#108", ""],
  ["p3", "Live Folders", "#112", `<em class="rev">Review</em>`],
];
$("side").innerHTML = sidebar({
  addr: `${GH.replace("<img", '<img style="width:18px;height:18px;border-radius:4px"')}github.com/jmaorr/Browsa/pull/108`,
  space: 1, tint: "#af52de",
  body: `<div class="sect">Pinned</div>
    <div class="row fold"><div class="in">${FOLDER}<span>Pull Requests</span><span class="spin" id="spin"></span><span class="n" id="n">0</span></div></div>
    <div class="kids">${PRS.map(([id, t, num, tag]) => `<div id="${id}" style="overflow:hidden">${R(GH, `${t} <span style="color:#a19d96">${num}</span>`, id === "p2" ? "" : "", id + "r").replace("</span></div></div>", `</span>${tag}</div></div>`)}</div>`).join("")}</div>
    ${R(img("linear.app"), "My issues · Linear")}
    <div class="sect">Today</div>${R(img("notion.so"), "Standup notes · Notion")}${R(img("figma.com"), "Library · Figma")}`,
  foot: {},
});
$("page").innerHTML = site("github") + `<div class="toast" id="toast">${FOLDER.replace('width="22" height="22"', 'width="18" height="18"')}Review requested: Live Folders #112</div>`;
document.querySelector(".gh h1").innerHTML = `Split View: swap, separate and close from the panel <span>#108</span>`;
document.querySelector(".gh .cmt .t").innerHTML = `<p>The panel's ••• handle now opens Swap, Separate and Close.</p><p>Also: back and forward on the left, reload on the right.</p>`;
document.querySelector(".gh .state").innerHTML = `<b class="open">Open</b> jmaorr wants to merge 9 commits into main`;

window.TOTAL = 9;
window.render = (t) => {
  // Rows arrive one by one, the newest selected tab in the folder highlighted.
  const arrive = [0.9, 2.2, 3.8];
  let n = 0;
  PRS.forEach(([id], i) => {
    const a = eo(ph(t, arrive[i], 0.45));
    if (t > arrive[i] + 0.2) n++;
    const merged = id === "p1" ? eio(ph(t, 6.2, 0.5)) : 0;
    $(id).style.maxHeight = a * (1 - merged) * 44 + "px";
    $(id).style.opacity = a * (1 - merged);
    const flash = Math.max(0, 1 - ph(t, arrive[i] + 0.4, 1.0)) * (t > arrive[i] ? 1 : 0);
    $(id + "r").querySelector(".in").style.background = id === "p2" && t > 2.6 ? "rgb(255 255 255 / .8)" : `rgb(175 82 222 / ${0.16 * flash})`;
  });
  // #107 merges and leaves the folder.
  const mergedTag = t > 5.4 && t < 6.6;
  const p1 = $("p1r").querySelector(".in");
  if (mergedTag && !p1.querySelector(".mer")) p1.insertAdjacentHTML("beforeend", `<em class="mer">Merged</em>`);
  if (!mergedTag && p1.querySelector(".mer")) p1.querySelector(".mer").remove();
  if (t > 6.4) n = 2;
  $("n").textContent = n;
  // A quiet spinner while it checks.
  const checking = (t > 0.4 && t < 1.0) || (t > 3.3 && t < 3.9) || (t > 5.0 && t < 5.5);
  $("spin").style.opacity = checking ? 1 : 0; $("spin").style.transform = `rotate(${t * 540}deg)`;
  const ti = eo(ph(t, 4.2, 0.4));
  $("toast").style.opacity = ti * (1 - ph(t, 5.8, 0.4));
  $("toast").style.transform = `translateY(${(1 - ti) * -8}px)`;
  // Only the window's contents fade at the loop point; the desktop and window stay put.
  const lf = 0.15 + 0.85 * loopFade(t, TOTAL); $("side").style.opacity = lf; $("page").style.opacity = lf;
};
render(0);
</script></body></html>
