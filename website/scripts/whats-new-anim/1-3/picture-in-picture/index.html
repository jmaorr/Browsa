<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/kit.css"><link rel="stylesheet" href="../../kit/sites.css"><link rel="stylesheet" href="../../library/shared/library.css"><link rel="stylesheet" href="../shared/scene.css"><script src="../../kit/kit.js"></script><script src="../../kit/sites.js"></script><script src="../../library/shared/library.js"></script><script src="../shared/scene.js"></script>
<style>
  .win { --tint:#ff3b30; }
  .yt { position:absolute; inset:0; background:#fff; }
  .yt .top { height:56px; display:flex; align-items:center; gap:10px; padding:0 22px; font-weight:700; font-size:19px; letter-spacing:-.04em; }
  .yt .top img { width:28px; height:20px; border-radius:0; } .yt .q { margin-left:60px; width:380px; height:38px; border-radius:19px; box-shadow:inset 0 0 0 1px #d3d3d3; }
  .yt .slot { position:absolute; left:24px; top:70px; width:640px; height:360px; border-radius:12px; background:#0f0f0f; }
  .yt h2 { position:absolute; left:24px; top:446px; width:640px; margin:0; font-size:20px; line-height:1.3; }
  .yt .ch { position:absolute; left:24px; top:486px; display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; }
  .yt .ch i { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#f6a,#a6f); }
  .yt .ch em { font-style:normal; font-weight:400; color:#606060; font-size:13px; display:block; }
  .yt .up { position:absolute; left:690px; right:20px; top:70px; }
  .yt .up div { display:flex; gap:10px; margin-bottom:12px; } .yt .up b { width:160px; height:90px; border-radius:8px; flex:none; }
  .yt .up p { margin:0; font-size:13px; font-weight:600; line-height:1.35; } .yt .up span { display:block; margin-top:4px; font-weight:400; color:#606060; font-size:12px; }
  #vid { position:absolute; z-index:20; border-radius:12px; overflow:hidden; background:#1b1530; }
  #vid.pip { box-shadow:0 0 0 1px rgb(255 255 255 / .15), 0 24px 50px -12px rgb(0 0 0 / .55); }
  #scene { position:absolute; inset:0; }
  .bar { position:absolute; left:0; right:0; bottom:0; height:4px; background:rgb(255 255 255 / .25); } .bar i { display:block; height:100%; background:#f00; }
  .pz { position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px; border-radius:50%; background:rgb(0 0 0 / .45); display:grid; place-items:center; }
  .pipc { position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; }
  .pipc span { width:28px; height:28px; border-radius:50%; background:rgb(0 0 0 / .4); display:grid; place-items:center; }
  .gbtn { margin-left:auto; width:28px; height:28px; border-radius:50%; background:rgb(255 255 255 / .75); box-shadow:0 0 0 .5px rgb(0 0 0 / .12), 0 1px 3px rgb(0 0 0 / .12); display:grid; place-items:center; flex:none; }
  .wave { display:flex; gap:2px; align-items:flex-end; height:12px; margin-left:auto; } .wave i { width:3px; background:#ff3b30; border-radius:1px; }
</style></head>
<body><div class="stage" id="stage">
  <div class="wall"></div>
  <div class="win"><div class="side" id="side"></div><div class="page" id="page"></div></div>
  <div id="vid"><div id="scene"></div><div class="bar"><i id="prog"></i></div><div class="pz" id="pz"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l13 8-13 8z"/></svg></div>
    <div class="pipc" id="pipc"><span><svg width="12" height="12" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></span><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 12l-5 4M7 12v4h4"/></svg></span></div></div>
  <div class="ring" id="ring"></div><div class="ptr" id="ptr"></div>
</div>
<script>
const PAUSE = `<svg width="12" height="12" viewBox="0 0 24 24" fill="#1d1d1f"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`;
const PLAY = `<svg width="12" height="12" viewBox="0 0 24 24" fill="#1d1d1f"><path d="M7 4l13 8-13 8z"/></svg>`;
$("side").innerHTML = sidebar({
  addr: `<span id="addr">${img("youtube.com").replace("<img", '<img style="width:18px;height:18px;border-radius:4px;vertical-align:-3px;margin-right:10px"')}youtube.com/watch?v=lofi</span>`, space: 1, tint: "#ff3b30",
  body: `<div class="sect">Pinned</div>${R(img("linear.app"), "My issues · Linear")}${R(img("github.com"), "Pull requests · GitHub")}
    <div class="sect">Today</div>
    <div class="row sel" id="ry"><div class="in">${img("youtube.com")}<span>lofi hip hop radio</span><span class="wave" id="wave"><i></i><i></i><i></i></span><span class="gbtn" id="pp">${PAUSE}</span></div></div>
    ${R(img("notion.so"), "Standup notes · Notion", "", "rn")}${R(img("figma.com"), "Library · Figma")}`,
  foot: {},
});
$("page").innerHTML = `<div class="yt" id="yt"><div class="top">${img("youtube.com")}YouTube<span class="q"></span></div><div class="slot" id="slot"></div>
  <h2>lofi beats to study to, live</h2><div class="ch"><i></i><div>Lofi Studio<em>1.2M subscribers</em></div></div>
  <div class="up">${[["#e5b7a5", "Synthwave radio 🌌 beats to chill/game to", "Lofi Studio · 21K watching"], ["#9fb8d9", "Rainy jazz café for focus", "Café Music · 890K views"], ["#b9d6b0", "Peaceful piano for studying", "Soft Keys · 3.4M views"], ["#d8c39a", "Late night coding mix", "Night Owl · 1.2M views"]].map(([c, a, b]) => `<div><b style="background:${c}"></b><p>${a}<span>${b}</span></p></div>`).join("")}</div></div>
  <div id="no" style="position:absolute;inset:0;opacity:0">${site("notion")}</div>`;
$("ptr").innerHTML = POINTER("#161513");
// The video: a dusk window scene that keeps moving while it plays.
$("scene").innerHTML = `<svg viewBox="0 0 640 360" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2350"/><stop offset=".6" stop-color="#c0618a"/><stop offset="1" stop-color="#f3a86b"/></linearGradient></defs>
  <rect width="640" height="360" fill="url(#sky)"/><g id="stars"></g><circle id="sun" cx="430" cy="250" r="46" fill="#ffd59a" opacity=".9"/>
  <g id="city" fill="#1e1838">${Array.from({ length: 16 }, (_, i) => `<rect x="${i * 44 - 10}" y="${220 + ((i * 37) % 70)}" width="40" height="200"/>`).join("")}</g>
  <rect x="0" y="0" width="640" height="360" fill="none" stroke="#1a1430" stroke-width="40"/><rect x="300" y="0" width="16" height="360" fill="#1a1430"/>
  <rect x="0" y="300" width="640" height="60" fill="#3a2a3f"/><g id="cat"><ellipse cx="140" cy="300" rx="38" ry="22" fill="#14101f"/><circle cx="170" cy="282" r="16" fill="#14101f"/><path d="M160 270l4-12 6 10M174 268l6-10 3 12" fill="#14101f"/><path id="tail" d="M104 300q-30 -10 -24 -40" stroke="#14101f" stroke-width="8" fill="none" stroke-linecap="round"/></g>
  <g id="steam" stroke="#fff" stroke-width="3" fill="none" opacity=".5"><path d="M520 270q8 -12 0 -24 q-8 -12 0 -24"/></g><rect x="505" y="272" width="32" height="28" rx="5" fill="#e9d6c4"/></svg>`;
const stage = $("stage");
const slotB = () => box($("slot"), stage);
const pageB = box($("page"), stage);
const PIP = { x: pageB.x + pageB.w - 400 - 24, y: pageB.y + pageB.h - 225 - 24, w: 400, h: 225 };
const RY = box($("ry"), stage), RN = box($("rn"), stage), PP = () => box($("pp"), stage);
const paused = (t) => t > 4.3 && t < 5.6;
const vtime = (t) => t - Math.max(0, Math.min(t, 5.6) - 4.3);
window.TOTAL = 9.5;
window.render = (t) => {
  // Out to Notion at 1.6: the video pops out. Back to YouTube at 7.0: it goes back.
  const out = eio(ph(t, 1.7, 0.6)) - eio(ph(t, 7.1, 0.6));
  const s = slotB();
  const r = { x: mix(s.x, PIP.x, out), y: mix(s.y, PIP.y, out), w: mix(s.w, PIP.w, out), h: mix(s.h, PIP.h, out) };
  Object.assign($("vid").style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
  $("vid").classList.toggle("pip", out > 0.05);
  const nf = Math.min(1, Math.max(0, ph(t, 1.6, 0.3) - ph(t, 7.0, 0.3)));
  $("no").style.opacity = nf;
  $("ry").classList.toggle("sel", nf < 0.5); $("rn").classList.toggle("sel", nf >= 0.5);
  $("addr").innerHTML = nf < 0.5 ? `${img("youtube.com").replace("<img", '<img style="width:18px;height:18px;border-radius:4px;vertical-align:-3px;margin-right:10px"')}youtube.com/watch?v=lofi` : `${img("notion.so").replace("<img", '<img style="width:18px;height:18px;border-radius:4px;vertical-align:-3px;margin-right:10px"')}notion.so/browsa/standup`;
  // Video motion.
  const vt = vtime(t);
  $("sun").setAttribute("cy", 250 + Math.sin(vt * 0.5) * 6);
  $("tail").setAttribute("d", `M104 300q-30 -10 ${-24 + Math.sin(vt * 2.2) * 14} -40`);
  $("steam").setAttribute("transform", `translate(${Math.sin(vt * 1.7) * 4} ${-(vt * 8) % 12})`);
  $("city").setAttribute("transform", `translate(${-(vt * 6) % 44} 0)`);
  $("prog").style.width = 8 + vt * 0.6 + "%";
  const p = paused(t);
  $("pz").style.opacity = p ? 1 : 0;
  $("pipc").style.opacity = out > 0.9 ? 1 : 0;
  $("pp").innerHTML = p ? PLAY : PAUSE;
  $("wave").querySelectorAll("i").forEach((e, i) => { e.style.height = p ? "3px" : 4 + Math.abs(Math.sin(vt * 6 + i * 1.3)) * 8 + "px"; });
  pointer(t, [[0.5, [960, 700]], [1.5, [RN.cx, RN.cy]], [4.2, [PP().cx, PP().cy]], [5.5, [PP().cx, PP().cy]], [6.9, [RY.cx - 40, RY.cy]], [8.4, [960, 720]]], [1.55, 4.25, 5.55, 6.95], 8.4);
  const lf = 0.15 + 0.85 * loopFade(t, TOTAL); $("side").style.opacity = lf; $("page").style.opacity = lf; $("vid").style.opacity = lf;
};
render(0);
</script></body></html>
